<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Prototype of the command map view (docs/views.md). Sample data and a scripted simulation only; it does not talk to Zoltbot. Loads three.js and fonts from public CDNs, which a real view may not do. -->
<title>Zoltbot Command Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="command-map.css">

<div class="app">
  <header class="bar">
    <div class="brand">
      <h1>Command map</h1>
      <span class="chip">Sample data</span>
    </div>
    <dl class="stats">
      <div class="stat"><dt>Spend today</dt><dd><b id="sSpend">$0.00</b> <span>/ $40</span></dd><div class="meter"><i id="sSpendBar"></i></div></div>
      <div class="stat"><dt>Active agents</dt><dd><b id="sActive">0</b> <span>/ 12</span></dd><div class="meter"><i id="sActiveBar"></i></div></div>
      <div class="stat"><dt>CI minutes</dt><dd><b id="sCi">0</b> <span>/ 2,000</span></dd><div class="meter"><i id="sCiBar"></i></div></div>
    </dl>
    <div class="bar-actions">
      <button class="btn needs-btn" id="needsBtn" type="button">Needs you <b class="count" id="needsCount">0</b><kbd aria-hidden="true">⌘I</kbd></button>
      <button class="btn" id="soundBtn" type="button" aria-pressed="false">Sound</button>
    </div>
  </header>

  <main class="stage">
    <section class="map" id="map" aria-label="Agent map">
      <canvas id="gl" aria-hidden="true"></canvas>
      <div class="overlay" id="regions" aria-hidden="true"></div>
      <div class="overlay" id="labels"></div>
      <div class="overlay" id="pings"></div>
      <div class="overlay"><div id="marquee" hidden></div></div>
      <div class="groups" id="groups" role="group" aria-label="Control groups"></div>
      <div class="mapctl">
        <div class="zoom">
          <button type="button" id="zoomOut" aria-label="Zoom out">−</button>
          <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
        </div>
        <canvas id="mini" width="152" height="112" aria-label="Minimap" role="img"></canvas>
      </div>
      <div id="toast" role="status" hidden></div>
    </section>
    <aside class="panel" id="panel" tabindex="-1" aria-label="Agents"></aside>
  </main>
  <div class="sr-only" aria-live="assertive" id="live"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- sample data ----------
  const REPOS = [
    { id: 'zoltbot', name: 'zoltbot', x: -14, z: -9, w: 28, d: 18 },
    { id: 'cloud', name: 'api-server', x: 20, z: -13, w: 24, d: 16 },
    { id: 'docs', name: 'docs-site', x: -8, z: 15, w: 24, d: 13 },
  ];
  const PROVIDERS = { claude: 'Claude Code', codex: 'Codex', gemini: 'Gemini', cursor: 'Cursor' };
  const STATE_WORD = { working: 'Working', idle: 'Idle', needs: 'Needs you', done: 'Done' };
  const mk = (id, repo, branch, provider, state, x, z, mins, cost, steps, extra) =>
    Object.assign({ id, repo, branch, provider, state, x, z, mins, cost, tokens: Math.round(cost * 410000), steps, step: 0, activity: steps[0], ask: null, since: 0, log: [], busy: null }, extra || {});
  const AGENTS = [
    mk('relay', 'zoltbot', 'fix/relay-reconnect', 'claude', 'working', -9, -4.5, 38, 2.14,
      ['Editing services/relay/src/session.ts', 'Reading packages/link/src/socket.ts', 'Writing a reconnect test', 'Running pnpm typecheck']),
    mk('inbox', 'zoltbot', 'feat/inbox-keyboard', 'codex', 'needs', 3, -5, 52, 1.72,
      ['Editing packages/ui/src/inbox/List.tsx', 'Adding j and k shortcuts', 'Running pnpm lint'],
      { since: 260, activity: 'Waiting for you', ask: { kind: 'permission', title: 'Allow git push origin feat/inbox-keyboard?', detail: 'Pushes 3 commits.', yes: 'Allow', no: 'Deny' } }),
    mk('biome', 'zoltbot', 'chore/biome-2', 'claude', 'done', -6, 4, 21, 0.64,
      ['Opened a pull request'], { activity: 'Opened a pull request: Upgrade Biome to 2.0' }),
    mk('pairing', 'zoltbot', 'feat/mobile-pairing', 'gemini', 'working', 6, 3.5, 17, 0.91,
      ['Running pnpm test in apps/mobile', 'Editing apps/mobile/src/pairing/Code.tsx', 'Reading packages/protocol/src/pair.ts', 'Updating the pairing screen']),
    mk('usage', 'cloud', 'feat/usage-meter', 'claude', 'working', 25, -8.5, 44, 2.86,
      ['Editing src/usage/meter.ts', 'Writing a database migration', 'Running pnpm test', 'Reading the billing contract']),
    mk('broker', 'cloud', 'fix/queue-timeout', 'codex', 'needs', 36, -7.5, 29, 1.38,
      ['Fixing the failing tests', 'Editing src/queue.ts', 'Running pnpm test'],
      { since: 95, activity: 'Waiting for you', ask: { kind: 'tests', title: 'Tests failed: 2 of 148', detail: 'queue.test.ts: retry after timeout.', yes: 'Fix them', no: 'Stop' } }),
    mk('canary', 'cloud', 'chore/release-checks', 'claude', 'idle', 30, -1.5, 0, 0.22,
      ['Reading the release workflow', 'Editing scripts/release.mjs', 'Running pnpm build'], { activity: 'Not started' }),
    mk('selfhost', 'docs', 'docs/self-hosting', 'cursor', 'working', -3.5, 18.5, 26, 0.77,
      ['Writing docs/self-hosting.md', 'Checking the relay setup steps', 'Adding a Docker example', 'Fixing broken links']),
    mk('changelog', 'docs', 'docs/changelog-0-2', 'claude', 'done', 5, 23, 12, 0.31,
      ['Opened a pull request'], { activity: 'Opened a pull request: Changelog for 0.2' }),
    mk('search', 'docs', 'fix/search-index', 'codex', 'idle', 10.5, 18, 0, 0.09,
      ['Reading the search index build', 'Editing scripts/build-index.mjs', 'Running pnpm build'], { activity: 'Stopped' }),
  ];
  const A = Object.fromEntries(AGENTS.map((a) => [a.id, a]));
  const repoName = (id) => REPOS.find((r) => r.id === id).name;
  const groups = { 1: { name: 'Frontend', ids: ['inbox', 'pairing', 'biome'] }, 2: { name: 'Infra', ids: ['relay', 'usage', 'broker', 'canary'] }, 3: null };
  const sel = new Set();
  let clock = 0, spendEarlier = 7.36, ciMinutes = 214, testRuns = 0, lastAlert = 'broker', needsCursor = -1;
  const LIMIT = 40, CAP = 12, CI_LIMIT = 2000;
  const stamp = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  const addLog = (a, text) => { a.log.unshift({ t: stamp(), text }); a.log.length = Math.min(a.log.length, 5); };
  AGENTS.forEach((a) => { addLog(a, a.ask ? a.ask.title : a.activity); });

  // ---------- three ----------
  const mapEl = $('#map'), canvas = $('#gl');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const scene = new THREE.Scene();
  const VIEW = 40, YAW = -0.42, ELEV = 0.9;
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 600);
  const dir = new THREE.Vector3(Math.sin(YAW) * Math.cos(ELEV), Math.sin(ELEV), Math.cos(YAW) * Math.cos(ELEV));
  const BOUNDS = { x0: -24, x1: 52, z0: -20, z1: 36 };
  const cam = { x: -1, z: 1, zoom: 1.45, tx: -1, tz: 1, tzoom: 1.45 };
  let W = 1, H = 1;
  const right = new THREE.Vector3(), gf = new THREE.Vector3();
  function placeCamera() {
    camera.position.set(cam.x + dir.x * 150, dir.y * 150, cam.z + dir.z * 150);
    camera.lookAt(cam.x, 0, cam.z);
    camera.zoom = cam.zoom;
    camera.updateProjectionMatrix();
    camera.updateMatrixWorld();
    right.setFromMatrixColumn(camera.matrixWorld, 0);
    gf.setFromMatrixColumn(camera.matrixWorld, 1); gf.y = 0; gf.normalize();
  }
  function resize() {
    W = Math.max(1, mapEl.clientWidth); H = Math.max(1, mapEl.clientHeight);
    renderer.setSize(W, H, false);
    const asp = W / H;
    camera.left = -VIEW * asp / 2; camera.right = VIEW * asp / 2; camera.top = VIEW / 2; camera.bottom = -VIEW / 2;
    placeCamera();
  }
  new ResizeObserver(resize).observe(mapEl);

  scene.add(new THREE.AmbientLight(0xffffff, 0.85));
  const sun = new THREE.DirectionalLight(0xffffff, 0.4); sun.position.set(-30, 60, 40); scene.add(sun);

  const themed = [];
  const mat = (Type, token, opts) => { const m = new THREE[Type](opts || {}); themed.push([m, token]); return m; };
  const T = {};

  // ground grid
  {
    const pts = [];
    for (let x = -60; x <= 90; x += 2) pts.push(x, 0, -60, x, 0, 80);
    for (let z = -60; z <= 80; z += 2) pts.push(-60, 0, z, 90, 0, z);
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    scene.add(new THREE.LineSegments(g, mat('LineBasicMaterial', '--map-grid')));
  }
  const plateMat = mat('MeshLambertMaterial', '--map-plate'), plateEdge = mat('LineBasicMaterial', '--map-plate-edge');
  const baseMat = mat('MeshLambertMaterial', '--map-base'), baseEdge = mat('LineBasicMaterial', '--map-base-edge');
  const box = (w, h, d, m, em, x, y, z) => {
    const geo = new THREE.BoxGeometry(w, h, d);
    const mesh = new THREE.Mesh(geo, m); mesh.position.set(x, y, z); scene.add(mesh);
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), em); e.position.copy(mesh.position); scene.add(e);
  };
  const regionLabels = REPOS.map((r) => {
    box(r.w, 0.5, r.d, plateMat, plateEdge, r.x + r.w / 2, 0.25, r.z + r.d / 2);
    const el = document.createElement('div'); el.className = 'region-label';
    $('#regions').appendChild(el);
    return { r, el };
  });

  const accentMat = mat('MeshBasicMaterial', '--accent', { side: THREE.DoubleSide });
  const attnMat = mat('MeshBasicMaterial', '--attention');
  const okMat = mat('MeshBasicMaterial', '--ok', { side: THREE.DoubleSide });
  const selMat = mat('MeshBasicMaterial', '--text', { side: THREE.DoubleSide });
  const screenMat = mat('MeshBasicMaterial', '--character-screen');
  const eyeMat = mat('MeshBasicMaterial', '--character-eye');
  const poleMat = mat('MeshBasicMaterial', '--text-muted');
  const ringGeo = new THREE.RingGeometry(1.2, 1.42, 48);
  const arcGeo = new THREE.RingGeometry(1.2, 1.42, 32, 1, 0, Math.PI * 1.35);
  const selGeo = new THREE.RingGeometry(1.75, 1.9, 56);
  const flagGeo = new THREE.BufferGeometry();
  flagGeo.setAttribute('position', new THREE.Float32BufferAttribute([0, 2.7, 0, 0, 1.9, 0, 1.1, 2.3, 0], 3));
  const flat = (mesh, y) => { mesh.rotation.x = -Math.PI / 2; mesh.position.y = y; return mesh; };

  const units = AGENTS.map((a, i) => {
    box(3.2, 1.3, 3.2, baseMat, baseEdge, a.x, 1.15, a.z);
    const g = new THREE.Group(); const ux = a.x + 3.4, uz = a.z + 1.2; g.position.set(ux, 0.5, uz); scene.add(g);
    const bodyMat = new THREE.MeshLambertMaterial();
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.8, 0.7), bodyMat); body.position.y = 0.4; g.add(body);
    const head = new THREE.Group(); head.position.y = 1.4; g.add(head);
    head.add(new THREE.Mesh(new THREE.BoxGeometry(1.35, 1.0, 1.0), bodyMat));
    const face = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.66, 0.06), screenMat); face.position.z = 0.5; head.add(face);
    [-0.24, 0.24].forEach((x) => { const e = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.24, 0.04), eyeMat); e.position.set(x, 0.02, 0.54); head.add(e); });
    const ringMat = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide });
    const ring = flat(new THREE.Mesh(ringGeo, ringMat), 0.03); g.add(ring);
    const arc = flat(new THREE.Mesh(arcGeo, accentMat), 0.04); g.add(arc);
    const selRing = flat(new THREE.Mesh(selGeo, selMat), 0.05); g.add(selRing);
    const pulses = [0, 1].map(() => {
      const m = new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, side: THREE.DoubleSide });
      const p = flat(new THREE.Mesh(ringGeo, m), 0.02); g.add(p); return p;
    });
    const beacon = new THREE.Mesh(new THREE.OctahedronGeometry(0.4), attnMat); beacon.position.y = 2.9; g.add(beacon);
    const flag = new THREE.Group(); flag.position.set(-1.25, 0, 0.2); g.add(flag);
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.7, 8), poleMat); pole.position.y = 1.35; flag.add(pole);
    flag.add(new THREE.Mesh(flagGeo, okMat));
    const label = document.createElement('button'); label.type = 'button'; label.className = 'unit-label';
    label.addEventListener('click', (e) => { pickAgent(a.id, e.shiftKey); });
    $('#labels').appendChild(label);
    const ping = document.createElement('button'); ping.type = 'button'; ping.className = 'ping'; ping.hidden = true;
    ping.addEventListener('click', () => jumpTo(a.id));
    $('#pings').appendChild(ping);
    return { a, g, ux, uz, head, bodyMat, ring, ringMat, arc, selRing, pulses, beacon, flag, label, ping, phase: i * 1.7, sx: 0, sy: 0 };
  });
  const U = Object.fromEntries(units.map((u) => [u.a.id, u]));

  const ICON = {
    working: '<svg class="ic st-working spin" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.6a5.4 5.4 0 1 1-5.4 5.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
    idle: '<svg class="ic st-idle" viewBox="0 0 14 14" aria-hidden="true"><path d="M5 3.5v7M9 3.5v7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
    needs: '<svg class="ic st-needs" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.2 13 12H1z" fill="currentColor"/><path d="M7 5.2v3.2M7 10.2v.2" fill="none" stroke="var(--bg-page)" stroke-width="1.5" stroke-linecap="round"/></svg>',
    done: '<svg class="ic st-done" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.4 5.6 10.4 11.5 3.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  };
  const ARROW = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8.5 4 12.5 8 8.5 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function refreshUnit(u) {
    const a = u.a, s = a.state;
    u.ring.visible = s !== 'working';
    u.ringMat.color.set(s === 'needs' ? T.attention : s === 'done' ? T.ok : T.dim);
    u.arc.visible = s === 'working';
    u.pulses.forEach((p) => { p.visible = s === 'needs'; p.material.color.set(T.attention); });
    u.beacon.visible = s === 'needs';
    u.flag.visible = s === 'done';
    u.selRing.visible = sel.has(a.id);
    const c = new THREE.Color(css('--provider-' + a.provider));
    if (s === 'idle') c.lerp(new THREE.Color(T.plate), 0.62);
    u.bodyMat.color.copy(c);
    u.label.dataset.state = s;
    u.label.classList.toggle('is-selected', sel.has(a.id));
    u.label.innerHTML = ICON[s] + '<span>' + esc(a.branch) + '</span>';
    u.label.setAttribute('aria-label', a.branch + ', ' + PROVIDERS[a.provider] + ', ' + STATE_WORD[s]);
    u.label.setAttribute('aria-pressed', sel.has(a.id) ? 'true' : 'false');
    u.ping.innerHTML = ARROW + '<span>' + esc(a.branch) + '</span>';
    u.ping.setAttribute('aria-label', 'Go to ' + a.branch + ', needs you');
  }
  function applyTheme() {
    themed.forEach(([m, token]) => { m.color.set(css(token)); });
    Object.assign(T, {
      ground: css('--map-ground'), plate: css('--map-plate'), edge: css('--map-plate-edge'), text: css('--text'), muted: css('--text-muted'),
      dim: css('--text-dim'), accent: css('--accent-text'), attention: css('--attention'), ok: css('--ok'), page: css('--bg-page'),
    });
    renderer.setClearColor(new THREE.Color(T.ground), 1);
    units.forEach(refreshUnit);
  }
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // ---------- projection ----------
  const v = new THREE.Vector3();
  const project = (x, y, z) => { v.set(x, y, z).project(camera); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H]; };
  function groundAt(nx, ny) {
    v.set(nx, ny, -1).unproject(camera);
    const t = v.y / dir.y;
    return [v.x - dir.x * t, v.z - dir.z * t];
  }
  function panBy(dx, dy) {
    const k = VIEW / cam.zoom / H;
    cam.tx = clamp(cam.tx - right.x * dx * k + gf.x * dy * k / Math.sin(ELEV), BOUNDS.x0, BOUNDS.x1);
    cam.tz = clamp(cam.tz - right.z * dx * k + gf.z * dy * k / Math.sin(ELEV), BOUNDS.z0, BOUNDS.z1);
  }
  const snapCam = () => { cam.x = cam.tx; cam.z = cam.tz; };
  const zoomBy = (f) => { cam.tzoom = clamp(cam.tzoom * f, 0.75, 2.8); };
  function focusOn(ids) {
    if (!ids.length) return;
    cam.tx = ids.reduce((s, id) => s + U[id].ux, 0) / ids.length;
    cam.tz = ids.reduce((s, id) => s + U[id].uz, 0) / ids.length;
    if (reduce.matches) { snapCam(); cam.zoom = cam.tzoom; }
  }

  // ---------- selection ----------
  function setSelection(ids) {
    sel.clear(); ids.forEach((id) => { sel.add(id); });
    units.forEach(refreshUnit); renderPanel();
  }
  function pickAgent(id, additive) {
    if (additive) { const next = new Set(sel); next.has(id) ? next.delete(id) : next.add(id); setSelection([...next]); }
    else setSelection([id]);
  }
  function jumpTo(id) { setSelection([id]); focusOn([id]); }
  const needsList = () => AGENTS.filter((a) => a.state === 'needs').sort((p, q) => q.since - p.since);
  function nextNeeds() {
    const list = needsList(); if (!list.length) return;
    const cur = list.findIndex((a) => sel.size === 1 && sel.has(a.id));
    jumpTo(list[(cur + 1) % list.length].id);
  }
  function selectGroup(n) {
    const g = groups[n]; if (!g || !g.ids.length) return;
    const same = sel.size === g.ids.length && g.ids.every((id) => sel.has(id));
    if (same) focusOn(g.ids); else setSelection(g.ids);
  }
  function setGroup(n) {
    if (!sel.size) return;
    groups[n] = { name: groups[n] ? groups[n].name : 'Group ' + n, ids: [...sel] };
    renderGroups(); renderPanel();
    toast('Group ' + n + ' set: ' + plural(sel.size));
  }
  const plural = (n) => n + (n === 1 ? ' agent' : ' agents');

  // ---------- pointer input ----------
  const ptrs = new Map(); let drag = null, pinch = null;
  const marquee = $('#marquee');
  const local = (e) => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('pointerdown', (e) => {
    if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
    canvas.setPointerCapture(e.pointerId);
    const [x, y] = local(e); ptrs.set(e.pointerId, [x, y]);
    if (ptrs.size === 2) {
      const [p, q] = [...ptrs.values()];
      pinch = { d: Math.hypot(p[0] - q[0], p[1] - q[1]), zoom: cam.tzoom }; drag = null; return;
    }
    const mode = e.pointerType === 'touch' || e.button !== 0 ? 'pan' : 'box';
    drag = { mode, sx: x, sy: y, lx: x, ly: y, moved: false, add: e.shiftKey };
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!ptrs.has(e.pointerId)) return;
    const [x, y] = local(e); ptrs.set(e.pointerId, [x, y]);
    if (pinch && ptrs.size === 2) {
      const [p, q] = [...ptrs.values()];
      cam.tzoom = cam.zoom = clamp(pinch.zoom * Math.hypot(p[0] - q[0], p[1] - q[1]) / pinch.d, 0.75, 2.8); return;
    }
    if (!drag) return;
    if (!drag.moved && Math.hypot(x - drag.sx, y - drag.sy) > 5) drag.moved = true;
    if (!drag.moved) return;
    if (drag.mode === 'pan') { panBy(x - drag.lx, y - drag.ly); snapCam(); }
    else {
      marquee.hidden = false;
      marquee.style.left = Math.min(x, drag.sx) + 'px'; marquee.style.top = Math.min(y, drag.sy) + 'px';
      marquee.style.width = Math.abs(x - drag.sx) + 'px'; marquee.style.height = Math.abs(y - drag.sy) + 'px';
    }
    drag.lx = x; drag.ly = y;
  });
  const endPtr = (e) => {
    if (!ptrs.has(e.pointerId)) return;
    const [x, y] = local(e); ptrs.delete(e.pointerId);
    if (pinch) { if (ptrs.size < 2) pinch = null; return; }
    if (!drag) return;
    const d = drag; drag = null; marquee.hidden = true;
    if (!d.moved) {
      let best = null, bd = 36;
      units.forEach((u) => { const dd = Math.hypot(u.sx - x, u.sy - y); if (dd < bd) { bd = dd; best = u; } });
      if (best) pickAgent(best.a.id, d.add); else if (!d.add) setSelection([]);
    } else if (d.mode === 'box') {
      const x0 = Math.min(x, d.sx), x1 = Math.max(x, d.sx), y0 = Math.min(y, d.sy), y1 = Math.max(y, d.sy);
      const hit = units.filter((u) => u.sx >= x0 && u.sx <= x1 && u.sy >= y0 && u.sy <= y1).map((u) => u.a.id);
      setSelection(d.add ? [...new Set([...sel, ...hit])] : hit);
    }
  };
  canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const mouseWheel = e.deltaX === 0 && Number.isInteger(e.deltaY) && Math.abs(e.deltaY) >= 50;
    if (e.ctrlKey || e.metaKey || mouseWheel) { zoomBy(Math.exp(-e.deltaY * (mouseWheel ? 0.0015 : 0.01))); cam.zoom = cam.tzoom; }
    else { panBy(-e.deltaX, -e.deltaY); snapCam(); }
  }, { passive: false });
  $('#zoomIn').addEventListener('click', () => zoomBy(1.25));
  $('#zoomOut').addEventListener('click', () => zoomBy(0.8));

  window.addEventListener('keydown', (e) => {
    const tag = e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    const k = e.key.toLowerCase();
    if (k === 'i' && !e.altKey) { e.preventDefault(); nextNeeds(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const digit = /^Digit([1-3])$/.exec(e.code);
    if (digit) { e.preventDefault(); e.shiftKey ? setGroup(+digit[1]) : selectGroup(+digit[1]); return; }
    if (e.key === 'Escape') { setSelection([]); return; }
    if (e.key === ' ' && tag !== 'BUTTON') { e.preventDefault(); if (A[lastAlert] && A[lastAlert].state === 'needs') jumpTo(lastAlert); else nextNeeds(); return; }
    const arrows = { ArrowLeft: [60, 0], ArrowRight: [-60, 0], ArrowUp: [0, 60], ArrowDown: [0, -60] };
    if (arrows[e.key] && tag !== 'BUTTON') { e.preventDefault(); panBy(arrows[e.key][0], arrows[e.key][1]); }
  });

  // ---------- minimap ----------
  const mini = $('#mini'), mctx = mini.getContext('2d');
  const MW = 152, MH = 112, mdpr = Math.min(window.devicePixelRatio || 1, 2);
  mini.width = MW * mdpr; mini.height = MH * mdpr;
  const mx = (x) => (x - BOUNDS.x0) / (BOUNDS.x1 - BOUNDS.x0) * MW, mz = (z) => (z - BOUNDS.z0) / (BOUNDS.z1 - BOUNDS.z0) * MH;
  function drawMini() {
    mctx.setTransform(mdpr, 0, 0, mdpr, 0, 0);
    mctx.fillStyle = T.page; mctx.fillRect(0, 0, MW, MH);
    REPOS.forEach((r) => {
      mctx.fillStyle = T.plate; mctx.strokeStyle = T.edge; mctx.lineWidth = 1;
      mctx.fillRect(mx(r.x), mz(r.z), mx(r.x + r.w) - mx(r.x), mz(r.z + r.d) - mz(r.z));
      mctx.strokeRect(mx(r.x) + 0.5, mz(r.z) + 0.5, mx(r.x + r.w) - mx(r.x), mz(r.z + r.d) - mz(r.z));
    });
    units.forEach((u) => {
      const s = u.a.state, x = mx(u.ux), y = mz(u.uz);
      mctx.fillStyle = s === 'needs' ? T.attention : s === 'done' ? T.ok : s === 'working' ? T.accent : T.dim;
      mctx.beginPath();
      if (s === 'needs') { mctx.moveTo(x, y - 5); mctx.lineTo(x + 5, y + 4); mctx.lineTo(x - 5, y + 4); mctx.closePath(); }
      else mctx.arc(x, y, 3, 0, 6.3);
      mctx.fill();
      if (sel.has(u.a.id)) { mctx.strokeStyle = T.text; mctx.lineWidth = 1.5; mctx.beginPath(); mctx.arc(x, y, 6.5, 0, 6.3); mctx.stroke(); }
    });
    mctx.strokeStyle = T.text; mctx.lineWidth = 1; mctx.beginPath();
    [[-1, 1], [1, 1], [1, -1], [-1, -1]].forEach(([nx, ny], i) => { const [gx, gz] = groundAt(nx, ny); i ? mctx.lineTo(mx(gx), mz(gz)) : mctx.moveTo(mx(gx), mz(gz)); });
    mctx.closePath(); mctx.stroke();
  }
  const miniGo = (e) => {
    const r = mini.getBoundingClientRect();
    cam.tx = clamp(BOUNDS.x0 + (e.clientX - r.left) / r.width * (BOUNDS.x1 - BOUNDS.x0), BOUNDS.x0, BOUNDS.x1);
    cam.tz = clamp(BOUNDS.z0 + (e.clientY - r.top) / r.height * (BOUNDS.z1 - BOUNDS.z0), BOUNDS.z0, BOUNDS.z1);
    if (reduce.matches) snapCam();
  };
  mini.addEventListener('pointerdown', (e) => { mini.setPointerCapture(e.pointerId); miniGo(e); });
  mini.addEventListener('pointermove', (e) => { if (e.buttons) miniGo(e); });

  // ---------- sound ----------
  let audio = null, soundOn = false;
  function tone(freq, at, len, type, vol) {
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + at;
    o.type = type; o.frequency.value = freq; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.start(t); o.stop(t + len + 0.02);
  }
  function play(kind) {
    if (!soundOn || !audio) return;
    if (kind === 'needs') [0, 0.16, 0.42, 0.58].forEach((t, i) => { tone(i % 2 ? 932 : 698, t, 0.14, 'triangle', 0.16); });
    else if (kind === 'done') [523, 659, 784].forEach((f, i) => { tone(f, i * 0.09, 0.35, 'sine', 0.12); });
    else if (kind === 'fail') [330, 247].forEach((f, i) => { tone(f, i * 0.2, 0.3, 'sawtooth', 0.07); });
  }
  $('#soundBtn').addEventListener('click', (e) => {
    soundOn = !soundOn; e.currentTarget.setAttribute('aria-pressed', String(soundOn));
    if (soundOn) { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); play('done'); }
  });

  // ---------- events and orders ----------
  let toastTimer = 0;
  function toast(text) { const t = $('#toast'); t.textContent = text; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3800); }
  const announce = (text) => { $('#live').textContent = text; };
  function changed() { units.forEach(refreshUnit); renderPanel(); renderBar(); }
  function raise(a, ask) {
    a.state = 'needs'; a.ask = ask; a.since = 0; a.busy = null; a.activity = 'Waiting for you'; lastAlert = a.id;
    addLog(a, ask.title); announce(a.branch + ' needs you: ' + ask.title); play(ask.kind === 'tests' ? 'fail' : 'needs'); changed();
  }
  function finish(a, text) {
    a.state = 'done'; a.activity = text; a.busy = null; addLog(a, text); announce(a.branch + ' is done'); play('done'); changed();
  }
  function resolve(id, yes) {
    const a = A[id], ask = a.ask; if (!ask) return;
    a.ask = null;
    if (ask.kind === 'tests' && !yes) { a.state = 'idle'; a.activity = 'Stopped'; }
    else {
      a.state = 'working';
      a.activity = ask.kind === 'tests' ? 'Fixing the failing tests' : ask.kind === 'choice' ? 'Continuing with ' + (yes ? ask.yes : ask.no).toLowerCase() : yes ? 'Allowed. Continuing' : 'Denied. Continuing without it';
    }
    addLog(a, 'You: ' + (yes ? ask.yes : ask.no)); changed();
    const left = needsList();
    if (left.length) toast(left.length === 1 ? '1 more needs you' : left.length + ' more need you');
  }
  function order(kind) {
    const ids = [...sel], skipped = []; let sent = 0;
    ids.forEach((id) => {
      const a = A[id];
      if (kind === 'stop') { a.state = 'idle'; a.ask = null; a.busy = null; a.activity = 'Stopped'; addLog(a, 'You: Stop'); sent++; return; }
      if (a.state === 'needs') { skipped.push(a.branch); return; }
      a.busy = { kind, until: clock + (kind === 'rebase' ? 4 : 7), prev: a.state };
      a.state = 'working'; a.activity = kind === 'rebase' ? 'Rebasing on main' : 'Running pnpm test';
      addLog(a, 'You: ' + (kind === 'rebase' ? 'Rebase on main' : 'Run tests')); sent++;
    });
    const name = { rebase: 'Rebase on main', tests: 'Run tests', stop: 'Stop' }[kind];
    let msg = name + ' sent to ' + plural(sent) + '.';
    if (skipped.length) msg += ' ' + skipped.join(', ') + (skipped.length === 1 ? ' is' : ' are') + ' waiting for you.';
    toast(msg); changed();
  }
  const SCRIPT = [
    [8, () => A.usage.state === 'working' && raise(A.usage, { kind: 'permission', title: 'Allow pnpm add zod@4.1.0?', detail: 'Adds a dependency to package.json.', yes: 'Allow', no: 'Deny' })],
    [22, () => A.selfhost.state === 'working' && !A.selfhost.busy && finish(A.selfhost, 'Opened a pull request: Self-hosting guide')],
    [40, () => A.pairing.state === 'working' && !A.pairing.busy && raise(A.pairing, { kind: 'choice', title: 'How long should the pairing code be?', detail: 'The protocol accepts both.', yes: '6 digits', no: '8 digits' })],
    [70, () => A.relay.state === 'working' && !A.relay.busy && raise(A.relay, { kind: 'permission', title: 'Allow git push origin fix/relay-reconnect?', detail: 'Pushes 5 commits.', yes: 'Allow', no: 'Deny' })],
  ];
  function tick() {
    clock++;
    SCRIPT.forEach((s) => { if (s[0] === clock) s[1](); });
    AGENTS.forEach((a) => {
      if (a.state === 'needs') a.since++;
      if (a.state !== 'working') return;
      a.cost += 0.004 + Math.random() * 0.008; a.tokens += 900 + Math.random() * 1800; if (clock % 60 === 0) a.mins++;
      if (a.busy) {
        if (clock < a.busy.until) return;
        const b = a.busy; a.busy = null;
        if (b.kind === 'rebase') { a.state = b.prev; a.activity = 'Rebased on main, no conflicts'; addLog(a, a.activity); changed(); }
        else {
          ciMinutes += 3; testRuns++;
          if (testRuns % 3 === 0) raise(a, { kind: 'tests', title: 'Tests failed: 2 of 148', detail: 'One timeout and one snapshot mismatch.', yes: 'Fix them', no: 'Stop' });
          else { a.state = b.prev; a.activity = 'Tests pass: 148 of 148'; addLog(a, a.activity); if (b.prev === 'done') play('done'); changed(); }
        }
        return;
      }
      if (clock % 6 === AGENTS.indexOf(a) % 6) { a.step = (a.step + 1) % a.steps.length; a.activity = a.steps[a.step]; addLog(a, a.activity); if (sel.has(a.id)) renderPanel(); }
    });
    renderBar(); updateLive();
  }

  // ---------- rendering: bar, groups, panel ----------
  const money = (n) => '$' + n.toFixed(2);
  const wait = (s) => (s < 60 ? s + 's' : Math.floor(s / 60) + 'm');
  const tokens = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : Math.round(n / 1000) + 'k');
  function renderBar() {
    const spend = spendEarlier + AGENTS.reduce((s, a) => s + a.cost, 0);
    const active = AGENTS.filter((a) => a.state === 'working' || a.state === 'needs').length;
    const n = needsList().length;
    $('#sSpend').textContent = money(spend); $('#sSpendBar').style.width = clamp(spend / LIMIT * 100, 0, 100) + '%';
    $('#sActive').textContent = active; $('#sActiveBar').style.width = active / CAP * 100 + '%';
    $('#sCi').textContent = ciMinutes; $('#sCiBar').style.width = ciMinutes / CI_LIMIT * 100 + '%';
    $('#needsCount').textContent = n; $('#needsBtn').classList.toggle('has', n > 0); $('#needsBtn').disabled = n === 0;
    regionLabels.forEach(({ r, el }) => {
      const mine = AGENTS.filter((a) => a.repo === r.id), w = mine.filter((a) => a.state === 'needs').length;
      el.innerHTML = esc(r.name) + '<span>' + plural(mine.length) + (w ? ', ' + w + (w === 1 ? ' needs you' : ' need you') : '') + '</span>';
    });
  }
  $('#needsBtn').addEventListener('click', nextNeeds);
  function renderGroups() {
    $('#groups').innerHTML = [1, 2, 3].filter((n) => groups[n]).map((n) =>
      '<button type="button" class="btn group-btn" data-group="' + n + '"><kbd aria-hidden="true">' + n + '</kbd>' + esc(groups[n].name) + '<span>' + groups[n].ids.length + '</span></button>').join('');
  }
  $('#groups').addEventListener('click', (e) => { const b = e.target.closest('[data-group]'); if (b) selectGroup(+b.dataset.group); });

  const stateText = (a) => '<span class="state st-' + a.state + '">' + STATE_WORD[a.state] + (a.state === 'needs' ? ' <span data-wait="' + a.id + '">' + wait(a.since) + '</span>' : '') + '</span>';
  const row = (a) => '<li><button type="button" class="row" data-select="' + a.id + '">' + ICON[a.state] + '<span class="name">' + esc(a.branch) + '</span>' + stateText(a) +
    '<span class="meta">' + esc(repoName(a.repo)) + ' · ' + PROVIDERS[a.provider] + '</span></button></li>';
  const ORDERS = '<div class="section"><h3>Orders</h3><div class="actions">' +
    '<button type="button" class="btn" data-order="rebase">Rebase on main</button><button type="button" class="btn" data-order="tests">Run tests</button><button type="button" class="btn danger" data-order="stop">Stop</button></div></div>';
  const BACK = '<button type="button" class="back" data-clear>‹ All agents</button>';
  const RANK = { needs: 0, working: 1, idle: 2, done: 3 };
  function renderPanel() {
    const panel = $('#panel'), hadFocus = panel.contains(document.activeElement);
    let h = '';
    if (sel.size === 0) {
      const list = [...AGENTS].sort((p, q) => RANK[p.state] - RANK[q.state] || q.since - p.since);
      h = '<div class="section"><h2>Agents</h2><ul class="rows">' + list.map(row).join('') + '</ul></div>' +
        '<div class="section keys-section"><h3>Keys</h3><dl class="keys">' +
        '<dt><kbd>Drag</kbd></dt><dd>Select agents</dd>' +
        '<dt><kbd>Space</kbd></dt><dd>Go to the latest alert</dd>' +
        '<dt><kbd>I</kbd></dt><dd>Next agent that needs you</dd>' +
        '<dt><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd></dt><dd>Select a group</dd>' +
        '<dt><kbd>Shift</kbd><kbd>1</kbd></dt><dd>Save the selection as a group</dd>' +
        '<dt><kbd>Scroll</kbd></dt><dd>Move the map</dd></dl></div>';
    } else if (sel.size === 1) {
      const a = A[[...sel][0]];
      h = BACK + '<div class="head"><h2 class="mono">' + esc(a.branch) + '</h2><p class="sub">' + esc(repoName(a.repo)) + ' · ' + PROVIDERS[a.provider] + '</p></div>' +
        '<div class="statechip st-' + a.state + '">' + ICON[a.state] + STATE_WORD[a.state] + (a.state === 'needs' ? ' for <span data-wait="' + a.id + '">' + wait(a.since) + '</span>' : '') + '</div>';
      if (a.ask) h += '<div class="ask"><strong>' + esc(a.ask.title) + '</strong><p>' + esc(a.ask.detail) + '</p><div class="actions">' +
        '<button type="button" class="btn primary" data-resolve="yes">' + esc(a.ask.yes) + '</button><button type="button" class="btn" data-resolve="no">' + esc(a.ask.no) + '</button></div></div>';
      else h += '<p>' + esc(a.activity) + '</p>';
      h += '<dl class="facts"><div><dt>Running</dt><dd>' + a.mins + ' min</dd></div><div><dt>Cost</dt><dd data-cost="' + a.id + '">' + money(a.cost) + '</dd></div><div><dt>Tokens</dt><dd data-tokens="' + a.id + '">' + tokens(a.tokens) + '</dd></div></dl>' +
        ORDERS + '<div class="section"><h3>Recent</h3><ol class="log">' + a.log.map((l) => '<li><time>' + l.t + '</time><span>' + esc(l.text) + '</span></li>').join('') + '</ol></div>';
    } else {
      const list = [...sel].map((id) => A[id]);
      h = BACK + '<h2>' + plural(sel.size) + ' selected</h2><ul class="rows">' + list.map(row).join('') + '</ul>' + ORDERS +
        '<div class="section"><h3>Save as group</h3><div class="actions">' + [1, 2, 3].map((n) => '<button type="button" class="btn" data-setgroup="' + n + '" aria-label="Save as group ' + n + '">' + n + '</button>').join('') + '</div></div>';
    }
    panel.innerHTML = h;
    if (hadFocus) panel.focus({ preventScroll: true });
  }
  $('#panel').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.select) jumpTo(b.dataset.select);
    else if (b.dataset.order) order(b.dataset.order);
    else if (b.dataset.resolve) resolve([...sel][0], b.dataset.resolve === 'yes');
    else if (b.dataset.setgroup) setGroup(+b.dataset.setgroup);
    else if ('clear' in b.dataset) setSelection([]);
  });
  function updateLive() {
    document.querySelectorAll('[data-wait]').forEach((el) => { el.textContent = wait(A[el.dataset.wait].since); });
    document.querySelectorAll('[data-cost]').forEach((el) => { el.textContent = money(A[el.dataset.cost].cost); });
    document.querySelectorAll('[data-tokens]').forEach((el) => { el.textContent = tokens(A[el.dataset.tokens].tokens); });
  }

  // ---------- frame ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; const t = now / 1000, still = reduce.matches;
    const k = still ? 1 : Math.min(1, dt * 9);
    cam.x += (cam.tx - cam.x) * k; cam.z += (cam.tz - cam.z) * k; cam.zoom += (cam.tzoom - cam.zoom) * k;
    placeCamera();
    units.forEach((u) => {
      const s = u.a.state;
      u.head.position.y = 1.4 + (s === 'working' && !still ? Math.sin(t * 5 + u.phase) * 0.07 : 0);
      if (s === 'working' && !still) u.arc.rotation.z -= dt * 3;
      if (s === 'needs') {
        u.pulses.forEach((p, i) => {
          const ph = still ? 0.45 : (t * 0.75 + i * 0.5) % 1, sc = 1 + ph * 2.1;
          p.scale.set(sc, sc, 1); p.material.opacity = (1 - ph) * 0.75;
        });
        u.beacon.position.y = 2.9 + (still ? 0 : Math.sin(t * 4) * 0.15); if (!still) u.beacon.rotation.y += dt * 2;
      }
      const c = project(u.ux, 1.6, u.uz); u.sx = c[0]; u.sy = c[1];
      const top = project(u.ux, s === 'needs' ? 4.2 : 3.2, u.uz);
      const on = c[0] > -40 && c[0] < W + 40 && c[1] > -20 && c[1] < H + 60;
      u.label.hidden = !on;
      if (on) u.label.style.transform = 'translate(-50%,-100%) translate(' + top[0].toFixed(1) + 'px,' + top[1].toFixed(1) + 'px)';
      const off = s === 'needs' && (c[0] < 8 || c[0] > W - 8 || c[1] < 8 || c[1] > H - 8);
      u.ping.hidden = !off;
      if (off) {
        const hw = Math.min(W / 2 - 4, u.ping.offsetWidth / 2 + 10);
        const px = clamp(c[0], hw, W - hw), py = clamp(c[1], 26, H - 26);
        u.ping.style.transform = 'translate(-50%,-50%) translate(' + px.toFixed(1) + 'px,' + py.toFixed(1) + 'px)';
        u.ping.firstElementChild.style.transform = 'rotate(' + Math.atan2(c[1] - py, c[0] - px).toFixed(2) + 'rad)';
      }
    });
    regionLabels.forEach(({ r, el }) => {
      const p = project(r.x + r.w, 0.5, r.z);
      el.style.transform = 'translate(-50%,-100%) translate(' + p[0].toFixed(1) + 'px,' + (p[1] - 6).toFixed(1) + 'px)';
    });
    renderer.render(scene, camera);
    drawMini();
    requestAnimationFrame(frame);
  }

  resize(); applyTheme(); renderBar(); renderGroups(); renderPanel();
  setInterval(tick, 1000);
  requestAnimationFrame(frame);
})();
</script>
