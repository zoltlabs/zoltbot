{
  "name": "overload",
  "provider": "codex",
  "steps": [
    {
      "on_input": {
        "match": {
          "method": "initialize"
        }
      }
    },
    {
      "reply": {
        "result": {
          "userAgent": "fake-codex",
          "codexHome": "/work/repo/.codex",
          "platformFamily": "unix",
          "platformOs": "macos"
        }
      }
    },
    {
      "on_input": {
        "match": {
          "method": "initialized"
        }
      }
    },
    {
      "on_input": {
        "match": {
          "method": "account/read"
        }
      }
    },
    {
      "reply": {
        "result": {
          "account": {
            "type": "apiKey"
          },
          "requiresOpenaiAuth": true
        }
      }
    },
    {
      "on_input": {
        "match": {
          "method": "thread/name/set"
        }
      }
    },
    {
      "reply": {
        "error": {
          "code": -32001,
          "message": "server overloaded"
        }
      }
    },
    {
      "on_input": {
        "match": {
          "method": "thread/name/set"
        }
      }
    },
    {
      "reply": {
        "result": {}
      }
    },
    {
      "hang": true
    }
  ]
}
