<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command map</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="map.css">
</head>
<body>
<div class="app">
<header class="bar">
<ul id="stats" class="stats" aria-label="Today"><li class="stat">Loading…</li></ul>
<div class="tools">
<span id="sample" class="tag" hidden>Sample data</span>
<button id="sound" type="button" class="round" aria-pressed="false" aria-label="Sound" title="Sound"></button>
</div>
</header>
<aside class="rail panel" aria-label="Chats">
<section id="asks" class="asks" aria-label="Requests"></section>
<div id="lists"></div>
<p id="empty" class="hint" hidden>No active chats. Open a chat in Zoltbot to begin.</p>
</aside>
<main id="stage" class="stage map" aria-label="Map. Drag to move, scroll to zoom, Shift and drag to select.">
<svg id="world" class="world" aria-hidden="true">
<g id="camera"><g id="ground"></g><g id="marks"></g><g id="things"></g></g>
</svg>
<div id="labels" class="labels"></div>
<div id="box" class="box" hidden></div>
<div class="camera-tools" role="group" aria-label="Camera">
<button type="button" id="zoom-in" class="round" aria-label="Zoom in" title="Zoom in (+)">+</button>
<button type="button" id="zoom-out" class="round" aria-label="Zoom out" title="Zoom out (−)">−</button>
<button type="button" id="fit" class="round" aria-label="Show the whole map" title="Show the whole map (0)"></button>
</div>
<section id="inspector" class="panel-card" role="region" aria-label="Selection" hidden></section>
<div class="turn">
<ul id="notes" class="notes" aria-label="Notifications"></ul>
<button id="next" type="button" class="next calm" disabled aria-label="Nothing needs you"><span>All clear</span></button>
</div>
</main>
<p id="error" role="alert"></p>
<p id="live" role="status" class="sr-only"></p>
</div>
<script src="_host/v1/zolt.js"></script>
<!-- What the map looks like: colors, sizes and sounds. -->
<script src="skin.js"></script>
<!-- Data: what each state means, where everything goes, and the ground. -->
<script src="states.js"></script>
<script src="layout.js"></script>
<script src="terrain.js"></script>
<!-- Drawing and interaction. -->
<script src="world.js"></script>
<script src="camera.js"></script>
<script src="labels.js"></script>
<script src="requests.js"></script>
<script src="rail.js"></script>
<script src="inspector.js"></script>
<script src="hud.js"></script>
<script src="sound.js"></script>
<script src="map.js"></script>
</body>
</html>
